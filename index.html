    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #3b82f6;
            --primary-dark: #2563eb;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
    }

    @layer base {
        body {
            @apply bg-[var(--bg-main)] text-[var(--text-main)] font-sans antialiased;
        }
    }

    @layer components {
        .btn {
            @apply px-6 py-2.5 rounded-xl font-medium transition-all duration-200 flex items-center justify-center gap-2;
        }
        .btn-primary {
            @apply bg-[var(--primary-color)] text-white hover:bg-[var(--primary-dark)] shadow-lg shadow-blue-500/20 active:scale-95;
        }
        .btn-secondary {
            @apply bg-white text-[var(--text-main)] border border-gray-200 hover:bg-gray-50 active:scale-95;
        }
        .input-field {
            @apply w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500/20 focus:border-[var(--primary-color)] outline-none transition-all;
        }
        .card {
            @apply bg-white rounded-2xl shadow-sm border border-gray-100;
        }
    }
    </style>
</head>
